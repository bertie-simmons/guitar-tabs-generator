name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/backend.yml
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/backend.yml

jobs:
  import-boundary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-api.txt
      - run: pip install -r requirements-api.txt
      - name: API imports with no pipeline deps installed
        run: python -c "import gtab.api.main; print(gtab.api.main.app.title)"

  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify API and worker entrypoints
        run: |
          python -c "from gtab.api.main import app; print(app.title)"
          python -c "from gtab.worker import process_job, run"

      - name: Start Azurite
        # for the azure backend's tests; they skip without it
        run: >-
          docker run -d -p 10000-10002:10000-10002
          mcr.microsoft.com/azure-storage/azurite
          azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
          --skipApiVersionCheck --loose

      - name: Run tests
        run: pytest -m "not slow" -q -rs
